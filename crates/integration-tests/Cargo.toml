[package]
name = "integration-tests"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
connectors = { version = "0.1.0", path = "../connectors" }
control-api = { version = "0.1.0", path = "../control-api" }
core-model = { version = "0.1.0", path = "../core-model" }
cucumber = "0.21.1"
delivery = { version = "0.1.0", path = "../delivery" }
futures-util.workspace = true
reqwest = { version = "0.13.2", features = ["json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "cucumber"
harness = false

[[test]]
name = "ws_cucumber"
harness = false

[[test]]
name = "e2e_real_data"
harness = true
