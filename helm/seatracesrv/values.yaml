# ──────────────────────────────────────────────────────────────────────────────
# Image
# ──────────────────────────────────────────────────────────────────────────────
image:
  repository: localhost:32000/seatracesrv
  tag: latest
  pullPolicy: IfNotPresent

# ──────────────────────────────────────────────────────────────────────────────
# Deployment
# ──────────────────────────────────────────────────────────────────────────────
replicaCount: 1

# ──────────────────────────────────────────────────────────────────────────────
# Application environment
# ──────────────────────────────────────────────────────────────────────────────
env:
  BIND_ADDR: "0.0.0.0:8080"
  RUST_LOG: "info"
  REDIS_URL: "redis://127.0.0.1:6379"

# Provide the API key in one of two ways (mutually exclusive):
#   1. Inline (not recommended for production):
#        secret.aisStreamApiKey: "your-key-here"
#   2. Reference an existing secret:
#        secret.existingSecret: "my-secret"
#        secret.existingSecretKey: "AISSTREAM_API_KEY"
secret:
  aisStreamApiKey: ""        # set via --set or values override
  existingSecret: ""         # name of a pre-existing k8s Secret
  existingSecretKey: "AISSTREAM_API_KEY"

# ──────────────────────────────────────────────────────────────────────────────
# Service
# ──────────────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8080
  # hostPort binds the container port directly to the node's IP address.
  # This is convenient for single-node development clusters without an ingress.
  hostPort: 8080
  # If type is NodePort, this is the port exposed on the host machine
  nodePort: 30080

# ──────────────────────────────────────────────────────────────────────────────
# Ingress (disabled by default)
# ──────────────────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: seatracesrv.local
  tls: []

# ──────────────────────────────────────────────────────────────────────────────
# Resources
# ──────────────────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# ──────────────────────────────────────────────────────────────────────────────
# Health probes
# ──────────────────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 10

# ──────────────────────────────────────────────────────────────────────────────
# Pod scheduling
# ──────────────────────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ──────────────────────────────────────────────────────────────────────────────
# Pod annotations / labels
# ──────────────────────────────────────────────────────────────────────────────
podAnnotations: {}
podLabels: {}

# ──────────────────────────────────────────────────────────────────────────────
# Catalog Worker
# ──────────────────────────────────────────────────────────────────────────────
catalogWorker:
  enabled: false

  image:
    repository: localhost:32000/catalog-worker
    tag: latest
    pullPolicy: IfNotPresent

  # "CronJob" (recommended) — Kubernetes handles scheduling; worker runs once
  #   per invocation and exits.
  # "Deployment"            — Worker runs continuously with its own refresh loop.
  kind: CronJob

  # CronJob-only settings (ignored when kind=Deployment)
  schedule: "0 3 * * *"          # daily at 03:00 UTC
  concurrencyPolicy: Forbid       # prevent overlapping jobs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  env:
    REDIS_URL: "redis://127.0.0.1:6379"
    DATA_DIR: "/data"
    RUST_LOG: "info"
    # How many catalog versions to keep in Redis (oldest pruned).
    CATALOG_VERSIONS_TO_KEEP: "3"
    # Deployment mode only — how often to rebuild (seconds).
    CATALOG_REFRESH_INTERVAL_SECS: "3600"

  # Extra env vars (passed as a list of {name, value} or {name, valueFrom} objects)
  extraEnv: []

  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # Persistent volume for downloaded map data (GEBCO, NOAA ENC, EMODnet).
  # Disable if you do not need local map data storage.
  persistence:
    enabled: false
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""              # leave empty to use the cluster default

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
