{{- if .Values.catalogWorker.enabled -}}
{{- if eq .Values.catalogWorker.kind "CronJob" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "catalogWorker.fullname" . }}
  labels:
    {{- include "catalogWorker.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.catalogWorker.schedule | quote }}
  concurrencyPolicy: {{ .Values.catalogWorker.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.catalogWorker.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.catalogWorker.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "catalogWorker.selectorLabels" . | nindent 12 }}
            {{- with .Values.catalogWorker.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.catalogWorker.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: catalog-worker
              image: "{{ .Values.catalogWorker.image.repository }}:{{ .Values.catalogWorker.image.tag }}"
              imagePullPolicy: {{ .Values.catalogWorker.image.pullPolicy }}
              env:
                - name: RUN_ONCE
                  value: "true"
                - name: REDIS_URL
                  value: {{ .Values.catalogWorker.env.REDIS_URL | quote }}
                - name: DATA_DIR
                  value: {{ .Values.catalogWorker.env.DATA_DIR | quote }}
                - name: RUST_LOG
                  value: {{ .Values.catalogWorker.env.RUST_LOG | quote }}
                {{- if .Values.catalogWorker.env.CATALOG_VERSIONS_TO_KEEP }}
                - name: CATALOG_VERSIONS_TO_KEEP
                  value: {{ .Values.catalogWorker.env.CATALOG_VERSIONS_TO_KEEP | quote }}
                {{- end }}
                {{- with .Values.catalogWorker.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with .Values.catalogWorker.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if .Values.catalogWorker.persistence.enabled }}
              volumeMounts:
                - name: data
                  mountPath: {{ .Values.catalogWorker.env.DATA_DIR }}
              {{- end }}
          {{- if .Values.catalogWorker.persistence.enabled }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "catalogWorker.fullname" . }}-data
          {{- end }}
          {{- with .Values.catalogWorker.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.catalogWorker.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.catalogWorker.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- else if eq .Values.catalogWorker.kind "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalogWorker.fullname" . }}
  labels:
    {{- include "catalogWorker.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "catalogWorker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "catalogWorker.selectorLabels" . | nindent 8 }}
        {{- with .Values.catalogWorker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.catalogWorker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: catalog-worker
          image: "{{ .Values.catalogWorker.image.repository }}:{{ .Values.catalogWorker.image.tag }}"
          imagePullPolicy: {{ .Values.catalogWorker.image.pullPolicy }}
          env:
            - name: REDIS_URL
              value: {{ .Values.catalogWorker.env.REDIS_URL | quote }}
            - name: DATA_DIR
              value: {{ .Values.catalogWorker.env.DATA_DIR | quote }}
            - name: RUST_LOG
              value: {{ .Values.catalogWorker.env.RUST_LOG | quote }}
            - name: CATALOG_REFRESH_INTERVAL_SECS
              value: {{ .Values.catalogWorker.env.CATALOG_REFRESH_INTERVAL_SECS | quote }}
            {{- if .Values.catalogWorker.env.CATALOG_VERSIONS_TO_KEEP }}
            - name: CATALOG_VERSIONS_TO_KEEP
              value: {{ .Values.catalogWorker.env.CATALOG_VERSIONS_TO_KEEP | quote }}
            {{- end }}
            {{- with .Values.catalogWorker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.catalogWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.catalogWorker.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.catalogWorker.env.DATA_DIR }}
          {{- end }}
      {{- if .Values.catalogWorker.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "catalogWorker.fullname" . }}-data
      {{- end }}
      {{- with .Values.catalogWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.catalogWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.catalogWorker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
