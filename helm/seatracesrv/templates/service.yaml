apiVersion: v1
kind: Service
metadata:
  name: {{ include "seatracesrv.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seatracesrv.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "seatracesrv.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
